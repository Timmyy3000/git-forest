name: Bug report
description: Report something broken in Forest
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the command you ran and relevant repo/worktree layout.
      placeholder: |
        1. Run `forest ...`
        2. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Forest version or commit
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11, macOS, Ubuntu, etc."
